[project]
name = "flybrain"
version = "0.1.0"
description = "MaleCNS connectome-constrained agent for FlyRunner: data pipeline, substrate model, RL training."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"   # flyvis pins <3.13
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=17",
  "torch>=2.4",
  "mlx>=0.20; sys_platform == 'darwin'",
  "neuprint-python>=0.6",
  "gymnasium>=1.0",
  "flyvis>=1.2",
  "tqdm",
  "rich",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[project.scripts]
flybrain = "flybrain.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flybrain"]

[tool.ruff]
line-length = 100
